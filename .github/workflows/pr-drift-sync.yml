# PR Drift Sync — REPORT ONLY since 2026-10-17.
#
# What changed and why (audit finding PF-01, 2026-10-17; pattern source:
# rebar-os-core PR #880):
#   This workflow used to merge `main` into PR branches (sync-and-arm on
#   open/reopen/synchronize, plus a scheduled-sync job over all open PRs)
#   and PUSH the result with the default GITHUB_TOKEN. GitHub's documented
#   rule: events caused by GITHUB_TOKEN do not start new workflow runs
#   (workflow_dispatch / repository_dispatch are the only exceptions).
#   The sync push therefore created a new PR head that NO gating workflow
#   ever ran on — no CI typecheck/lint/test/build. rebar-os-core hit the
#   identical fault (PRs sat at sync-commit heads with no gating suites
#   until manually closed and reopened) and fixed it in PR #880 by making
#   this workflow report-only; this file mirrors that fix.
#
#   The push bought nothing: branch protection does not require branches
#   to be up to date with main, pull_request workflows check out GitHub's
#   merge commit (branch + current main) so tests already run against the
#   merged tree, and squash merges land behind-branches cleanly. Removing
#   the push removes the whole failure class: every PR head is now created
#   by an author/bot/UI push that fires the full check board. The
#   scheduled-sync job and the sign-off-label guard existed only to serve
#   the push path and are removed with it.
#
# What this workflow does now: measures drift (behind/ahead vs main) and
# reports it in the step summary. It never writes to the branch. If a
# branch genuinely needs main merged in, use the PR's "Update branch"
# button — that push carries the clicker's identity and fires all suites.
#
# Post-merge verification for this change (run once after it lands):
# open a throwaway PR from a behind-main branch; confirm (a) no sync
# commit appears on the branch, and (b) the check board at the ORIGINAL
# head contains the CI "Typecheck · Lint · Test · Build" job and the
# other pull_request-triggered checks.
name: PR Drift Sync

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened

concurrency:
  group: pr-drift-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sync-and-arm:
    name: Report drift from main (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout base repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Measure drift and report
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -eu
          git fetch origin "refs/pull/$PR_NUMBER/head"
          read BEHIND AHEAD <<EOF
          $(git rev-list --left-right --count "origin/main...$HEAD_SHA")
          EOF
          {
            echo "### PR Drift Sync (report only)"
            echo
            echo "Branch \`$HEAD_REF\` is **$BEHIND** commit(s) behind \`main\` and **$AHEAD** ahead."
            echo
            echo "No sync push was made. Checks run against GitHub's merge commit"
            echo "(branch + current main), and branch protection does not require"
            echo "the branch to be up to date. If you want main merged into the"
            echo "branch itself, use the **Update branch** button on the PR —"
            echo "that push fires the full check suite at the new head."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "behind=$BEHIND ahead=$AHEAD (report only; no push)"
