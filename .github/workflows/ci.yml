name: CI

on:
  push:
    branches: [main, "agent/**", "openclaw/**"]
  pull_request:
    branches: [main, "openclaw/critical-security-hardening-20260916"]

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Edge Function Deno check
        run: >-
          deno check
          supabase/functions/copyright-check/index.ts
          supabase/functions/image-reframe/index.ts
          supabase/functions/video-analyze/index.ts
          supabase/functions/video-transcript/index.ts

      - name: Edge Function focused tests
        run: >-
          deno test
          supabase/functions/_shared/core/gemini-policy.deno.ts
          supabase/functions/_shared/core/safe-media-fetch.deno.ts
          supabase/functions/copyright-check/ownership.deno.ts
          supabase/functions/image-reframe/owned-input.deno.ts
          supabase/functions/video-analyze/analysis.deno.ts
          supabase/functions/video-transcript/security.deno.ts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
